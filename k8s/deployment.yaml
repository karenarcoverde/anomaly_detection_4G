
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-4g
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anomaly-4g
  template:
    metadata:
      labels:
        app: anomaly-4g
    spec:
      containers:
        - name: anomaly-4g
          image: anomaly-4g:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-4g
spec:
  type: ClusterIP
  selector:
    app: anomaly-4g
  ports:
    - port: 3000
      targetPort: 3000